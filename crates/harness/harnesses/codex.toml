schema_version = 1
name = "codex"
command = ["codex"]
install = "npm install --global @openai/codex"
depends_on = ["npm"]

[[credential]]
source = "file:.codex/auth.json"
target = "/home/agent/.codex/auth.json"
host_base = "home"
on_missing = "warn"

[[credential]]
source = "keychain:codex-cli"
target = "/home/agent/.codex/auth.json"
platforms = ["macos"]
on_missing = "warn"

# Parent dir: tmpfs so codex can create runtime databases (state_5, logs_N,
# wal/shm siblings) that are not pinned individually. Without this the
# directory only materializes as an implicit mount parent (root-owned 0755)
# and codex fails with sqlite "unable to open database file" (code 14).
[[mount]]
host = ""
target = "/home/agent/.codex"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

# State: pinned files that survive across sessions (history, sessions, SQLite)
[[mount]]
host = ".codex/history.jsonl"
target = "/home/agent/.codex/history.jsonl"
type = "state"
access = "pinned"
host_base = "home"

[[mount]]
host = ".codex/sessions"
target = "/home/agent/.codex/sessions"
type = "state"
access = "pinned_dir"
host_base = "home"

[[mount]]
host = ".codex/state_5.sqlite"
target = "/home/agent/.codex/state_5.sqlite"
type = "state"
access = "pinned"
host_base = "home"

[[mount]]
host = ".codex/state_5.sqlite-wal"
target = "/home/agent/.codex/state_5.sqlite-wal"
type = "state"
access = "pinned"
host_base = "home"

[[mount]]
host = ".codex/state_5.sqlite-shm"
target = "/home/agent/.codex/state_5.sqlite-shm"
type = "state"
access = "pinned"
host_base = "home"

[[mount]]
host = ".codex/models_cache.json"
target = "/home/agent/.codex/models_cache.json"
type = "state"
access = "pinned"
host_base = "home"

# Config: read-only when exists
[[mount]]
host = ".codex/config.toml"
target = "/home/agent/.codex/config.toml"
type = "config"
access = "ro"
host_base = "home"

[[mount]]
host = ".codex/AGENTS.md"
target = "/home/agent/.codex/AGENTS.md"
type = "config"
access = "ro"
host_base = "home"

[[mount]]
host = ".codex/AGENTS.override.md"
target = "/home/agent/.codex/AGENTS.override.md"
type = "config"
access = "ro"
host_base = "home"

[[mount]]
host = ".agents/skills"
target = "/home/agent/.agents/skills"
type = "config"
access = "ro"
host_base = "home"

[[mount]]
host = ".codex/skills"
target = "/home/agent/.codex/skills"
type = "config"
access = "ro"
host_base = "home"

# Ephemeral: tmpfs churn mounts (logs, caches, temp)
[[mount]]
host = ""
target = "/home/agent/.codex/log"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

[[mount]]
host = ""
target = "/home/agent/.codex/cache"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

[[mount]]
host = ""
target = "/home/agent/.codex/tmp"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

[[mount]]
host = ""
target = "/home/agent/.codex/.tmp"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

[allowlist]
translation = "none"
