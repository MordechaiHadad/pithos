schema_version = 1
name = "codex"
command = ["codex"]
install = "npm install --global @openai/codex"
depends_on = ["npm"]

[[credential]]
source = "file:.codex/auth.json"
target = "/home/agent/.codex/auth.json"
host_base = "home"
on_missing = "warn"

[[credential]]
source = "keychain:codex-cli"
target = "/home/agent/.codex/auth.json"
platforms = ["macos"]
on_missing = "warn"

[[mount]]
host = ".codex"
target = "/home/agent/.codex"
type = "state"
access = "pinned_dir"
host_base = "home"

[[mount]]
host = ".codex/AGENTS.md"
target = "/home/agent/.codex/AGENTS.md"
type = "config"
access = "ro"
host_base = "home"

[[mount]]
host = ".codex/AGENTS.override.md"
target = "/home/agent/.codex/AGENTS.override.md"
type = "config"
access = "ro"
host_base = "home"

[[mount]]
host = ".agents/skills"
target = "/home/agent/.agents/skills"
type = "config"
access = "ro"
host_base = "home"

[[mount]]
host = ".codex/skills"
target = "/home/agent/.codex/skills"
type = "config"
access = "ro"
host_base = "home"

# Ephemeral: tmpfs churn mounts (logs, caches, temp)
[[mount]]
host = ""
target = "/home/agent/.codex/log"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

[[mount]]
host = ""
target = "/home/agent/.codex/cache"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

[[mount]]
host = ""
target = "/home/agent/.codex/tmp"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

[[mount]]
host = ""
target = "/home/agent/.codex/.tmp"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

[allowlist]
translation = "none"
