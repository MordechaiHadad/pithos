schema_version = 1
name = "opencode"
command = ["opencode"]
install = "npm install --global opencode-ai"
depends_on = ["npm"]

# Credentials: gated on credentials = true, read-only
[[credential]]
source = "file:auth.json"
target = "/home/agent/.local/share/opencode/auth.json"
host_base = "data:opencode"
on_missing = "warn"

# State: pinned files that survive across sessions
[[mount]]
host = "opencode.db"
target = "/home/agent/.local/share/opencode/opencode.db"
type = "state"
access = "pinned"
host_base = "data:opencode"

[[mount]]
host = "opencode.db-wal"
target = "/home/agent/.local/share/opencode/opencode.db-wal"
type = "state"
access = "pinned"
host_base = "data:opencode"

[[mount]]
host = "opencode.db-shm"
target = "/home/agent/.local/share/opencode/opencode.db-shm"
type = "state"
access = "pinned"
host_base = "data:opencode"

[[mount]]
host = "kv.json"
target = "/home/agent/.local/state/opencode/kv.json"
type = "state"
access = "pinned"
host_base = "state:opencode"

[[mount]]
host = "session.json"
target = "/home/agent/.local/state/opencode/session.json"
type = "state"
access = "pinned"
host_base = "state:opencode"

[[mount]]
host = "model.json"
target = "/home/agent/.local/state/opencode/model.json"
type = "state"
access = "pinned"
host_base = "state:opencode"

[[mount]]
host = "prompt-history.jsonl"
target = "/home/agent/.local/state/opencode/prompt-history.jsonl"
type = "state"
access = "pinned"
host_base = "state:opencode"

# models.dev catalog cache: without it every session starts from the
# version-bundled snapshot and newly released models stay hidden
[[mount]]
host = "models.json"
target = "/home/agent/.cache/opencode/models.json"
type = "state"
access = "pinned"
host_base = "cache:opencode"

# Config: read-only when exists, required if credentials or allowlist present
[[mount]]
host = ".config/opencode"
target = "/home/agent/.config/opencode"
type = "config"
access = "ro"
host_base = "home"

# Plugins: global plugins always mounted when present (no credentials gate)
[[mount]]
host = ".config/opencode/plugins"
target = "/home/agent/.config/opencode/plugins"
type = "config"
access = "ro"
host_base = "home"

# Ephemeral: tmpfs churn mounts
[[mount]]
host = ""
target = "/home/agent/.local/share/opencode"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

[[mount]]
host = ""
target = "/home/agent/.local/state/opencode"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

[[mount]]
host = ""
target = "/home/agent/.cache"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

[[mount]]
host = ""
target = "/home/agent/.serena"
type = "ephemeral"
access = "tmpfs"
host_base = "home"

# Sandbox permissions override: when pithos.toml sets
# `sandbox_config = "config:..."`, the referenced harness-native
# opencode.json is mounted here, replacing the host config file below.
# The file uses opencode's own `permission` syntax verbatim; pithos
# never parses its contents beyond a JSON validity check.
[allowlist]
target = "/home/agent/.config/opencode/opencode.json"
format = "json"
