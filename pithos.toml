base_image = "node:22-bookworm-slim"
image_tag = "localhost/pithos-opencode:latest"
workspace = "/workspace"

exclusions = ["target", ".serena"]

toolchains = ["rust", "python"]
cargo = ["just"]
npm = []
bun = []
uv = [{ name = "serena-agent", python = "3.13", run = "serena init" }]
downloads = [
    { url = "https://deno.land/install.sh", env = { DENO_INSTALL = "/usr/local" } },
]

diff_viewer = "nvim -c \"Neotree git_status dir={dir}\""

[toolchain.rust]
install = ["gcc", "libc6-dev"]
mise = ["rust", "rust-analyzer"]

[toolchain.python]
mise = ["python", "uv"]

[harness]
name = "opencode"
command = ["opencode", "/workspace"]

# [harness.allowlist]
# edit = "allow"

[harness.allowlist.bash]
"*" = "allow"
"curl -T *" = "deny"
"curl --upload-file *" = "deny"
"wget --post-file *" = "deny"
"wget --post-data *" = "deny"

[credentials]
opencode = true

[environment]
TERM = "xterm-256color"

# [networking]
# Restrict egress from the agent container. Loaded into the container's
# network namespace from the host via an OCI hook (see README / plan).
# Values are raw integers in KiB. At least one of payload_size or quota is
# required. Host prerequisite: `sudo apt install nftables`.
# payload_size = 8               # per-connection upload cap, KiB (unset = no cap)
# quota = 102400                 # per-session egress budget, KiB (unset = no quota)
# whitelist = ["proxy.example.com"]   # extra hosts bypassing cap + quota
# use_default_whitelist = true   # false disables opencode.ai/exa.ai defaults
