base_image = "node:22-bookworm-slim"
image_tag = "localhost/pithos-opencode:latest"
workspace = "/workspace"

install = ["git"]
cargo = ["just"]
npm = []
bun = []
uv = [{ name = "serena-agent", python = "3.13", run = "serena init" }]
downloads = [
    { url = "https://deno.land/install.sh", env = { DENO_INSTALL = "/usr/local" } },
]

diff_viewer = "nvim -c \"Neotree git_status dir={dir}\""

[harness]
name = "opencode"
command = ["opencode", "/workspace"]

# [harness.allowlist]
# edit = "allow"

[harness.allowlist.bash]
"*" = "allow"
"curl -T *" = "deny"
"curl --upload-file *" = "deny"
"wget --post-file *" = "deny"
"wget --post-data *" = "deny"

[credentials]
opencode = true

[environment]
TERM = "xterm-256color"

