[package]
name = "pithos"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
eyre = "0.6.14"
indicatif = "0.18.6"
rayon = "1.12.0"
reflink-copy = { version = "0.1.30", features = ["tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
tempfile = "3.27.0"
toml = "1.1.4"
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.profiling]
inherits = "release"
debug = true
